[extension]
id = "bishu-novel"
name = "Bishu Novel"
version = "0.1.0"
api_version = "1"
description = "Novel production APIs and deterministic workflows for DeterminFlow."
backend = "ai_company_plugin_bishu_novel.backend.extension:create_extension"
dependencies = []
capabilities = [
  "api.routes",
  "api.middleware",
  "database.postgres",
  "workflow.runtime",
  "resources.agents",
  "resources.prompts",
  "resources.workflows",
  "resources.scripts",
]

[resource_namespace]
prefix = "bishu-novel"

[installation]
requirements = "requirements.txt"

[resources]
agents = "resources/agents.json"
prompts = "resources/prompts.json"
workflows = "resources/workflows"
script_libraries = "resources/script-library"

[lifecycle]
migrate_command = [
  "${PYTHON}",
  "-m",
  "ai_company_plugin_bishu_novel.backend.migrations_cli",
  "migrate",
  "--release-revision",
  "${PLUGIN_REVISION}",
]
verify_command = [
  "${PYTHON}",
  "-m",
  "ai_company_plugin_bishu_novel.backend.migrations_cli",
  "verify",
  "--release-revision",
  "${PLUGIN_REVISION}",
]
working_directory = "."
timeout_seconds = 300

[settings]
schema = "settings.schema.json"
