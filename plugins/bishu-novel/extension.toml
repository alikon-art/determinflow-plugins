[extension]
id = "bishu-novel"
name = "Bishu Novel"
version = "0.2.2"
api_version = "1"
description = "File-only novel production workflows for DeterminFlow."
dependencies = []
capabilities = [
  "workflow.runtime",
  "resources.agents",
  "resources.prompts",
  "resources.skills",
  "resources.workflows",
  "resources.scripts",
]

[resource_namespace]
prefix = "bishu-novel"

[resources]
agents = "resources/agents.json"
prompts = "resources/prompts.json"
skills = "resources/skills.json"
skill_bundles = "resources/skill-bundles"
workflows = "resources/workflows"
script_libraries = "resources/script-library"
