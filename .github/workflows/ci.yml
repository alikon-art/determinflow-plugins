name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bishu-novel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/determinflow
          path: determinflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            determinflow/requirements-dev.lock
            plugins/bishu-novel/requirements.txt
      - run: python -m pip install -r determinflow/requirements-dev.lock
      - run: python -m pip install -r plugins/bishu-novel/requirements.txt
      - name: Test Plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/determinflow:${{ github.workspace }}/plugins/bishu-novel
        run: python -m pytest -q plugins/bishu-novel/tests
      - name: Validate Workflows
        run: >-
          python determinflow/src/core/defaults/skills/workflow-guide/scripts/validate_definition.py
          plugins/bishu-novel/resources/workflows
      - name: Build Python package
        run: |
          python -m pip install build
          python -m build plugins/bishu-novel
